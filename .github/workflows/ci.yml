name: build-and-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install native build and transport dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev curl bubblewrap apparmor
      - name: Enable and check evaluation namespaces
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor.
          # Permit the packaged bubblewrap on this ephemeral CI runner only;
          # retain the global restriction and run all tests without sudo.
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          # The outer evaluation shares the broker network; checker workers
          # create nested namespaces with their own network and /proc.
          bwrap --unshare-all --share-net --die-with-parent --new-session \
            --ro-bind / / --proc /proc --dev /dev -- \
            bwrap --unshare-all --die-with-parent --new-session \
              --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          mkdir /tmp/elan-installer
          tar -xzf /tmp/elan.tar.gz -C /tmp/elan-installer
          /tmp/elan-installer/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean project
        run: |
          if ! lake exe cache get --cache-from=master Mathlib.Data.PFunctor.Univariate.Basic; then
            echo 'Mathlib cache unavailable; building the pinned dependency from source.'
          fi
          lake build
          lake build eval_tools
      - name: Install pinned evaluation baseline
        run: npm ci --prefix eval/baseline --ignore-scripts
      - name: Check Rust bindings
        run: |
          cargo fmt --manifest-path runtime/native/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path runtime/native/Cargo.toml --target-dir .lake/build/rust-native -- -D warnings
          cargo test --locked --manifest-path runtime/native/Cargo.toml --target-dir .lake/build/rust-native
      - name: Audit verified core
        run: python3 scripts/check_core.py
      - name: Run executable tests
        run: |
          lake exe harness_tests
          lake exe runtime_properties
          python3 Tests/runtime_contracts.py
          python3 Tests/native_abi.py
          python3 Tests/provider_transport.py
          python3 Tests/integration.py
          python3 Tests/crash_recovery.py
          python3 Tests/session_boundaries.py
          python3 Tests/evaluation.py
          python3 Tests/evaluation_baseline.py
          python3 Tests/evaluation_isolation.py
          python3 Tests/continuation_audit.py
          python3 Tests/evaluation_patches.py
          python3 Tests/evaluation_window.py
          python3 Tests/public_reporting.py
          python3 eval/corpus/test_checkers.py
          python3 eval/corpus/validate.py --output /tmp/corpus-validation.json
