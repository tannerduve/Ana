name: build-and-contracts
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install native build and transport dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev curl zstd bubblewrap apparmor util-linux
      - name: Enable and check the Linux process sandbox
        run: |
          # Permit only the packaged launcher on this ephemeral Ubuntu runner.
          # Product startup never changes host policy or falls back to host execution.
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          exec 3</usr
          bwrap --unshare-user --unshare-pid --unshare-net --disable-userns \
            --die-with-parent --ro-bind-fd 3 /usr --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - name: Install elan
        run: |
          if ! curl -sSfL --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz; then
            curl -sSfL --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 \
              -H 'Accept: application/octet-stream' https://api.github.com/repos/leanprover/elan/releases/assets/258187011 -o /tmp/elan.tar.gz
          fi
          echo 'f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b  /tmp/elan.tar.gz' | sha256sum --check --status
          mkdir /tmp/elan-installer
          tar -xzf /tmp/elan.tar.gz -C /tmp/elan-installer
          /tmp/elan-installer/elan-init -y --default-toolchain none
          bash scripts/install_ci_lean.sh lean-toolchain
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean project
        run: |
          if ! lake exe cache get --cache-from=master Mathlib.Data.PFunctor.Univariate.Basic; then
            echo 'Mathlib cache unavailable; building the pinned dependency from source.'
          fi
          lake build
      - name: Check Rust bindings
        run: |
          cargo fmt --manifest-path runtime/native/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path runtime/native/Cargo.toml --target-dir .lake/build/rust-native -- -D warnings
          cargo test --locked --manifest-path runtime/native/Cargo.toml --target-dir .lake/build/rust-native
      - name: Audit verified core
        run: python3 scripts/check_core.py
      - name: Run executable tests
        run: |
          lake exe harness_tests
          lake exe runtime_properties
          lake exe application_contracts
          lake exe inventory_recovery_contracts
          lake exe journal_writer_contracts
          lake exe durable_session_contracts
          python3 Tests/runtime_contracts.py
          python3 Tests/capability_policy.py
          python3 Tests/native_abi.py
          python3 Tests/provider_transport.py
          python3 Tests/cli_providers.py
          python3 Tests/provider_streaming.py
          python3 Tests/provider_json_bounds.py
          python3 Tests/event_output.py
          python3 Tests/integration.py
          python3 Tests/crash_recovery.py
          python3 Tests/journal_serialization.py
          python3 Tests/recovery_observations.py
          python3 Tests/session_boundaries.py
          python3 Tests/sandbox_contracts.py
          python3 Tests/process_timeouts.py
          python3 Tests/artifacts.py
          # This Python-only codec seam uses the product runtime_contracts binary.
          python3 eval/Tests/json_codec.py
      - name: Extended stateful IO sequences
        if: github.event_name == 'schedule'
        timeout-minutes: 10
        env:
          HARNESS_IO_SEQUENCES: '2000'
          HARNESS_IO_SEQUENCE_LENGTH: '100'
        run: .lake/build/bin/runtime_properties
