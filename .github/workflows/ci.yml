name: build-and-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install native build and transport dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev curl
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          mkdir /tmp/elan-installer
          tar -xzf /tmp/elan.tar.gz -C /tmp/elan-installer
          /tmp/elan-installer/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean project
        run: lake build
      - name: Check Rust bindings
        run: |
          cargo fmt --manifest-path runtime/native/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path runtime/native/Cargo.toml --target-dir .lake/build/rust-native -- -D warnings
          cargo test --locked --manifest-path runtime/native/Cargo.toml --target-dir .lake/build/rust-native
      - name: Audit verified core
        run: python3 scripts/check_core.py
      - name: Run executable tests
        run: |
          lake exe harness_tests
          lake exe runtime_properties
          python3 Tests/runtime_contracts.py
          python3 Tests/native_abi.py
          python3 Tests/provider_transport.py
          python3 Tests/integration.py
          python3 Tests/crash_recovery.py
          python3 Tests/session_boundaries.py
